<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>歩きスマホ退治</title>
<style>
  :root{
    --navy:#1b2a4a; --navy-deep:#121c33; --ribbon:#c8323c; --paper:#f6f1e7; --gold:#e8b923;
    --font:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#20232b;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--font)}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #safe{position:fixed;top:0;left:0;height:0;width:0;padding-top:env(safe-area-inset-top);visibility:hidden}
  .ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box;
    background:rgba(18,28,51,.52);color:var(--paper)}
  .ov.hidden{display:none}
  .card{width:min(440px,100%);max-height:100%;overflow:auto;box-sizing:border-box;background:var(--navy);
    border-radius:10px;padding:26px 26px 22px;box-shadow:0 10px 40px rgba(0,0,0,.45);position:relative}
  .card::before{content:"";position:absolute;left:26px;top:0;width:44px;height:10px;background:var(--ribbon);border-radius:0 0 4px 4px}
  h1{margin:8px 0 4px;font-size:clamp(30px,8vw,46px);letter-spacing:.08em;line-height:1.15;font-weight:800}
  h2{margin:8px 0 6px;font-size:clamp(26px,7vw,36px);letter-spacing:.06em;line-height:1.2;font-weight:800}
  .lead{margin:0 0 16px;font-size:15px;line-height:1.7;opacity:.88}
  ul.how{list-style:none;margin:0 0 20px;padding:0;font-size:15px;line-height:1.6}
  ul.how li{padding:7px 0;border-top:1px solid rgba(246,241,231,.16)}
  ul.how b{color:var(--gold);font-weight:700}
  .stats{margin:4px 0 20px;font-size:16px;line-height:1.9}
  .stats span{display:inline-block;min-width:4.8em;opacity:.7}
  button{font:inherit;font-weight:800;font-size:18px;letter-spacing:.1em;color:#fff;background:var(--ribbon);
    border:0;border-radius:8px;padding:14px 20px;width:100%;cursor:pointer;touch-action:manipulation}
  button:active{transform:translateY(1px);filter:brightness(.92)}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  button[disabled]{opacity:.55}
  .sub{margin-top:10px;background:transparent;border:1px solid rgba(246,241,231,.35);font-size:14px;font-weight:600;padding:9px 14px;letter-spacing:.04em}
  @media (max-height:520px){
    .card{padding:18px 22px 16px}
    .card::before{left:22px}
    h1{margin:6px 0 2px;font-size:clamp(26px,5.5vw,34px)}
    h2{margin:6px 0 2px;font-size:clamp(22px,5vw,30px)}
    .lead{margin:0 0 8px;font-size:13px;line-height:1.5}
    ul.how{margin:0 0 12px;font-size:13px;line-height:1.45}
    ul.how li{padding:5px 0}
    .stats{margin:2px 0 12px;font-size:14px;line-height:1.7}
    button{font-size:16px;padding:10px 16px}
    .sub{margin-top:8px;font-size:13px;padding:7px 12px}
    .card{width:min(520px,100%)}
  }
  @media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>

<div id="ovTitle" class="ov">
  <div class="card">
    <h1>歩きスマホ退治</h1>
    <p class="lead">通学路を右へ500m。前を見ていない人たちを、姉が正面から止める。</p>
    <ul class="how">
      <li><b>画面の左右を押す</b>:押した側へ歩く(1歩=1m)</li>
      <li><b>敵をタップ</b>:3m以内はスライディング(中は無敵)、それより遠いと剣圧</li>
      <li>歩きスマホの人と重なるとマインド-20(最初は100)。0になるとゲームオーバー</li>
    </ul>
    <button id="btnStart" disabled>読み込み中…</button>
    <button id="btnSnd" class="sub">効果音:オン</button>
  </div>
</div>

<div id="ovEnd" class="ov hidden">
  <div class="card">
    <h2 id="endTitle"></h2>
    <p class="lead" id="endLead"></p>
    <div class="stats" id="endStats"></div>
    <button id="btnRetry">もう一度</button>
  </div>
</div>

/* ---------- 画像読み込み ---------- */
const IM={me:{},en:{}};
function loadAll(){
  const ps=[];
  for(const g of ['me','en']) for(const k in SPR[g]){
    IM[g][k]=SPR[g][k].map(src=>{
      const im=new Image();
      ps.push(new Promise(r=>{im.onload=r;im.onerror=r;}));
      im.src=src; return im;
    });
  }
  return Promise.all(ps);
}

/* ---------- 定数 ---------- */
const PPM=48;            // 1m = 48px
const GOAL=500;          // クリア距離(m)
const MIND0=100, DMG=20;
const SPEED=3.1;         // 歩く速さ(m/s)
const SLIDE_T=0.5, SLIDE_V0=14;   // 平均7m/s × 0.5秒 ≒ 3.5m
const NEAR=3;            // 3m以内はスライディング
const SWORD_T=0.42, SWORD_FIRE=0.28, BEAM_T=0.16;
const KP=1.3, KE=1.0;    // 自キャラ/敵の表示倍率
const WALKSEQ=[0,1,2,1];
const FONT='"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif';

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,S=1,LW=640,LH=360,footY=280,safeTop=0;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  S=Math.min(W/(H>W?500:640),H/360);
  LW=W/S; LH=H/S;
  footY=Math.max(280,LH*0.66);
  safeTop=$('safe').offsetHeight/S;
}
window.addEventListener('resize',resize);
resize();

function rnd(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- 効果音(WebAudio) ---------- */
let AC=null, sfxOn=true;
function audioInit(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||!sfxOn)return;
  const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t+dur+0.03);
}
const SFX={
  slash:()=>tone(1500,280,.16,'sawtooth',.05),
  slide:()=>tone(520,110,.32,'triangle',.08),
  hit:()=>{tone(520,1000,.09,'square',.04);tone(1000,1500,.1,'square',.03,.09);},
  dmg:()=>tone(240,70,.32,'sawtooth',.08),
  clear:()=>[523,659,784,1046].forEach((f,i)=>tone(f,f,.24,'triangle',.07,i*.13)),
  over:()=>[392,330,262,196].forEach((f,i)=>tone(f,f*.98,.34,'triangle',.07,i*.22))
};

/* ---------- ゲーム状態 ---------- */
let state='title';     // title / play / clearing / over / clear
let time=0, camX=0, shake=0, endT=0, hintT=0;
let nextSpawn=10, kills=0, hitsTaken=0, dispMind=MIND0;
let enemies=[], beams=[], parts=[], floats=[], queued=null;
const P={x:0,dir:1,st:'idle',t:0,anim:0,inv:0,hurt:0,mind:MIND0,fired:false,target:null};
const input={held:new Map(),tapDir:0,tapT:0,keyL:false,keyR:false};

function reset(){
  P.x=0;P.dir=1;P.st='idle';P.t=0;P.anim=0;P.inv=0;P.hurt=0;P.mind=MIND0;P.fired=false;P.target=null;
  enemies=[];beams=[];parts=[];floats=[];queued=null;
  nextSpawn=10;kills=0;hitsTaken=0;dispMind=MIND0;shake=0;endT=0;hintT=7;
  input.held.clear();input.tapT=0;
  camX=P.x*PPM-LW*0.32;
}
const psx=()=>P.x*PPM-camX;

/* ---------- 入力 ---------- */
function toLogical(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/S, y:(e.clientY-r.top)/S};
}
function pickEnemy(x,y){
  let best=null,bd=1e9;
  for(const e of enemies){
    if(e.state!=='phone')continue;
    const sx=e.x*PPM-camX, d=Math.abs(x-sx);
    if(d<72 && y>footY-225 && y<footY+40 && d<bd){bd=d;best=e;}
  }
  return best;
}
cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault();
  if(state!=='play')return;
  const p=toLogical(ev), en=pickEnemy(p.x,p.y);
  if(en){requestAttack(en);return;}
  input.held.set(ev.pointerId,p);
  input.tapDir=p.x>psx()?1:-1; input.tapT=0.3;
  try{cv.setPointerCapture(ev.pointerId);}catch(e){}
},{passive:false});
cv.addEventListener('pointermove',ev=>{
  if(input.held.has(ev.pointerId))input.held.set(ev.pointerId,toLogical(ev));
});
const upPtr=ev=>{input.held.delete(ev.pointerId);};
cv.addEventListener('pointerup',upPtr);
cv.addEventListener('pointercancel',upPtr);
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')input.keyL=true;
  if(e.key==='ArrowRight'||e.key==='d')input.keyR=true;
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')input.keyL=false;
  if(e.key==='ArrowRight'||e.key==='d')input.keyR=false;
});
window.addEventListener('blur',()=>{input.held.clear();input.keyL=input.keyR=false;});

function inputDir(){
  if(input.keyL!==input.keyR)return input.keyR?1:-1;
  let dir=0;
  for(const p of input.held.values()){
    const dx=p.x-psx();
    if(Math.abs(dx)>18){dir=dx>0?1:-1;}
  }
  if(dir)return dir;
  if(input.tapT>0)return input.tapDir;
  return 0;
}

/* ---------- 攻撃 ---------- */
function requestAttack(en){
  if(P.st==='slide'||P.st==='sword'){queued={en,t:0.3};return;}
  startAttack(en);
}
function startAttack(en){
  const dx=en.x-P.x;
  P.dir=dx>=0?1:-1; P.t=0; P.anim=0; queued=null;
  if(Math.abs(dx)<=NEAR){P.st='slide';SFX.slide();}
  else{P.st='sword';P.fired=false;P.target=en;SFX.slash();}
}
function fireBeam(){
  const en=P.target; P.fired=true;
  if(!en||en.state!=='phone')return;
  beams.push({x0:P.x+P.dir*(100/PPM),y0:-80,en,t:0,dir:P.dir});
}
function hitEnemy(e){
  if(e.state!=='phone')return;
  e.state='hit';e.t=0;e.hitFlip=P.x>e.x;
  e.kbv=(e.x>=P.x?1:-1)*2.4;
  kills++;SFX.hit();
  const wx=e.x*PPM;
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2,v=80+Math.random()*180;
    parts.push({x:wx,y:-110,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:.45+Math.random()*.25,c:i%2?'#bfe8ff':'#ffffff',r:2+Math.random()*3});
  }
}
function damage(e){
  e.dmg=true;
  P.mind=Math.max(0,P.mind-DMG);P.hurt=0.9;shake=0.3;hitsTaken++;SFX.dmg();
  floats.push({x:P.x*PPM,y:-175,t:0,text:'マインド -'+DMG,c:'#ff6b6b'});
  if(P.mind<=0){state='over';endT=1.0;P.st='idle';SFX.over();input.held.clear();}
}

/* ---------- 敵 ---------- */
function spawn(m){
  const ahead=(LW*(1-0.32))/PPM+1.6;
  enemies.push({
    x:P.x+ahead, state:'phone', t:rnd(m)*2, dmg:false,
    speed:0.95+0.5*(m/GOAL)+rnd(m*3.7)*0.35, kbv:0, hitFlip:false
  });
}

/* ---------- 更新 ---------- */
function updatePlayer(dt){
  if(P.hurt>0)P.hurt-=dt;
  if(P.inv>0)P.inv-=dt;
  if(input.tapT>0)input.tapT-=dt;
  if(P.st==='slide'){
    P.t+=dt;
    P.x+=P.dir*SLIDE_V0*Math.max(0,1-P.t/SLIDE_T)*dt;
    if(P.t>=SLIDE_T){P.st='idle';P.inv=0.15;P.anim=0;}
  }else if(P.st==='sword'){
    P.t+=dt;
    if(!P.fired&&P.t>=SWORD_FIRE)fireBeam();
    if(P.t>=SWORD_T){P.st='idle';P.anim=0;}
  }else{
    const dir=state==='clearing'?1:(state==='play'?inputDir():0);
    if(state==='clearing'&&P.x>=GOAL+2.5){P.st='idle';P.anim=0;}
    else if(dir){P.dir=dir;P.x+=dir*SPEED*dt;P.st='walk';P.anim+=dt;}
    else{P.st='idle';P.anim=0;}
  }
  if(state==='play'&&(P.st==='idle'||P.st==='walk')&&queued){
    queued.t-=dt;
    if(queued.t<=0)queued=null;
    else if(queued.en.state==='phone'){startAttack(queued.en);}
    else queued=null;
  }
  if(queued&&(P.st==='slide'||P.st==='sword')){queued.t-=dt;if(queued.t<=0)queued=null;}
  P.x=clamp(P.x,0,GOAL+2.5);
}
function updateEnemies(dt){
  for(const e of enemies){
    e.t+=dt;
    if(e.state==='phone'){
      e.x-=e.speed*dt;
      const dx=Math.abs(e.x-P.x);
      if(state==='play'){
        if(P.st==='slide'&&dx<1.1)hitEnemy(e);
        else if(!e.dmg&&P.st!=='slide'&&P.inv<=0&&dx<0.85)damage(e);
      }
    }else if(e.state==='hit'){
      e.x+=e.kbv*dt;e.kbv*=Math.pow(0.04,dt);
      if(e.t>=0.85){e.state='walk';e.t=0;}
    }else{
      e.x+=1.5*dt;
    }
  }
  // 画面外に出た敵は消す(出現直後の右外にいる歩きスマホは残す)
  enemies=enemies.filter(e=>{
    const sx=e.x*PPM-camX;
    if(sx<-150)return false;
    if(e.state==='walk'&&sx>LW+150)return false;
    return true;
  });
}
function updateFx(dt){
  for(const b of beams){
    b.t+=dt;
    if(b.t>=BEAM_T&&!b.done){b.done=true;hitEnemy(b.en);}
  }
  beams=beams.filter(b=>b.t<BEAM_T+0.12);
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;}
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.t+=dt;}
  floats=floats.filter(f=>f.t<1.1);
  if(shake>0)shake=Math.max(0,shake-dt);
  dispMind+=(P.mind-dispMind)*Math.min(1,dt*8);
}
function update(dt){
  time+=dt;
  if(hintT>0&&state==='play')hintT-=dt;
  if(state==='play'||state==='clearing'||state==='over'){
    if(state!=='over')updatePlayer(dt);
    updateEnemies(dt);
    updateFx(dt);
    if(state==='play'){
      while(P.x>=nextSpawn&&nextSpawn<GOAL){spawn(nextSpawn);nextSpawn+=10;}
      if(P.x>=GOAL){
        state='clearing';endT=1.6;P.st='walk';P.inv=99;queued=null;input.held.clear();SFX.clear();
      }
    }else if(state==='clearing'){
      endT-=dt;if(endT<=0)showEnd(true);
    }else if(state==='over'){
      endT-=dt;if(endT<=0&&!endShown)showEnd(false);
    }
  }
  const target=P.x*PPM-LW*0.32;
  camX+=(target-camX)*Math.min(1,dt*9);
}

  for(const p of parts){
    ctx.globalAlpha=clamp(p.life*3,0,1);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x-camX,footY+p.y,p.r,0,6.3);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const f of floats){
    const a=1-f.t/1.1;
    ctx.globalAlpha=clamp(a*1.6,0,1);
    ctx.font='800 22px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=5;ctx.strokeStyle='rgba(20,10,10,.8)';ctx.lineJoin='round';
    const x=f.x-camX,y=footY+f.y-f.t*40;
    ctx.strokeText(f.text,x,y);ctx.fillStyle=f.c;ctx.fillText(f.text,x,y);
  }
  ctx.globalAlpha=1;
}
// 舞い落ちる銀杏の葉
const leaves=[];
for(let i=0;i<14;i++)leaves.push({x:Math.random(),y:Math.random(),s:0.6+Math.random()*0.9,r:Math.random()*6,v:20+Math.random()*25});
function drawLeaves(dt){
  for(const l of leaves){
    l.y+=l.v*dt/LH;l.x-=(8+l.v*0.4)*dt/LW;l.r+=dt*1.5;
    if(l.y>1){l.y=-0.05;l.x=Math.random()*1.2;}
    if(l.x<-0.05)l.x=1.05;
    ctx.save();ctx.translate(l.x*LW,l.y*LH);ctx.rotate(l.r);
    ctx.fillStyle='rgba(240,196,50,.85)';
    ctx.beginPath();ctx.ellipse(0,0,7*l.s,3.4*l.s*Math.abs(Math.cos(l.r*0.7)+0.3),0,0,6.3);ctx.fill();
    ctx.restore();
  }
}

/* ---------- 描画: HUD ---------- */
function txt(s,x,y,size,align,col,weight){
  ctx.font=(weight||800)+' '+size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='alphabetic';
  ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='rgba(18,28,51,.75)';
  ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function drawHUD(){
  const pad=14,top=pad+safeTop;
  // マインド
  txt('マインド',pad,top+14,15,'left','#f6f1e7');
  const bx=pad,by=top+22,bw=Math.min(230,LW*0.42),bh=16;
  ctx.fillStyle='rgba(18,28,51,.7)';ctx.fillRect(bx-2,by-2,bw+4,bh+4);
  const r=clamp(dispMind/MIND0,0,1);
  ctx.fillStyle=P.mind>60?'#4fc3a1':(P.mind>30?'#f2b84b':'#e5484d');
  ctx.fillRect(bx,by,bw*r,bh);
  ctx.fillStyle='rgba(18,28,51,.6)';
  for(let i=1;i<5;i++)ctx.fillRect(bx+bw*i/5-1,by,2,bh);
  txt(String(Math.round(P.mind)),bx+bw+10,by+bh-1,18,'left','#f6f1e7');
  // 距離
  const m=Math.min(GOAL,Math.floor(P.x));
  txt('/ '+GOAL+'m',LW-pad,top+14,15,'right','#f6f1e7',700);
  txt(String(m),LW-pad-62,top+34,34,'right','#ffffff');
  // 進行バー
  const py=top+52,px0=pad,px1=LW-pad;
  ctx.fillStyle='rgba(18,28,51,.6)';ctx.fillRect(px0,py,px1-px0,6);
  ctx.fillStyle='#e8b923';ctx.fillRect(px0,py,(px1-px0)*clamp(P.x/GOAL,0,1),6);
  ctx.fillStyle='#c8323c';ctx.beginPath();ctx.arc(px0+(px1-px0)*clamp(P.x/GOAL,0,1),py+3,7,0,6.3);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  txt('校門',px1,py+24,13,'right','#f6f1e7',700);
  // 操作ヒント
  if(hintT>0&&state==='play'){
    ctx.globalAlpha=clamp(hintT,0,1);
    txt('画面の左右を押して歩く ・ 敵をタップで攻撃',LW/2,LH-16,15,'center','#ffffff',700);
    ctx.globalAlpha=1;
  }
  // 被弾の赤み
  if(P.hurt>0){
    const a=clamp(P.hurt/0.9,0,1)*0.35;
    const g=ctx.createRadialGradient(LW/2,LH/2,Math.min(LW,LH)*0.3,LW/2,LH/2,Math.max(LW,LH)*0.75);
    g.addColorStop(0,'rgba(220,40,50,0)');g.addColorStop(1,'rgba(220,40,50,'+a+')');
    ctx.fillStyle=g;ctx.fillRect(0,0,LW,LH);
  }
}

function draw(dt){
  ctx.setTransform(dpr*S,0,0,dpr*S,0,0);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*10*shake/0.3,(Math.random()-.5)*8*shake/0.3);
  drawSky();drawClouds();
  drawFar(0.08,120,'#c3d4df',90,150,footY-70);
  drawFar(0.18,100,'#a8bdcd',60,130,footY-70);
  drawMid();drawSchoolBack();drawWall();drawGround();drawProps();
  for(const e of enemies)if(e.state!=='phone')drawEnemy(e);
  for(const e of enemies)if(e.state==='phone')drawEnemy(e);
  drawPlayer();drawFx();drawWires();drawLeaves(dt);
  ctx.restore();
  if(state!=='title')drawHUD();
}

/* ---------- 画面遷移 ---------- */
let endShown=false;
function showEnd(clear){
  endShown=true;
  const m=Math.min(GOAL,Math.floor(P.x));
  if(clear){
    state='clear';
    $('endTitle').textContent='登校完了';
    $('endLead').textContent=P.mind>=MIND0?'一度も気を取られずに校門へ。完璧な通学路。':'500m歩ききった。校門はもうすぐそこだ。';
  }else{
    $('endTitle').textContent='マインドが尽きた…';
    $('endLead').textContent='校門まであと'+(GOAL-m)+'m。もう一度、前を向いて。';
  }
  $('endStats').innerHTML='<div><span>距離</span>'+m+' m</div><div><span>撃退</span>'+kills+' 体</div><div><span>被弾</span>'+hitsTaken+' 回</div><div><span>マインド</span>'+Math.round(P.mind)+'</div>';
  $('ovEnd').classList.remove('hidden');
}
function startGame(){
  audioInit();
  reset();endShown=false;
  state='play';
  $('ovTitle').classList.add('hidden');$('ovEnd').classList.add('hidden');
}
$('btnStart').addEventListener('click',startGame);
$('btnRetry').addEventListener('click',startGame);
$('btnSnd').addEventListener('click',()=>{
  sfxOn=!sfxOn;$('btnSnd').textContent='効果音:'+(sfxOn?'オン':'オフ');
  if(sfxOn){audioInit();SFX.hit();}
});

/* ---------- メインループ ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);draw(dt);
  requestAnimationFrame(loop);
}
reset();
loadAll().then(()=>{
  $('btnStart').disabled=false;$('btnStart').textContent='スタート';
});
requestAnimationFrame(loop);

// テスト用に最小限のフックを公開(ゲーム進行には使わない)
window.__game={P,get state(){return state;},get enemies(){return enemies;},startGame};
})();
</script>
